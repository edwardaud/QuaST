name: gates

# The full gate suite, one job, plus a smoke job that proves the package loads and
# the production card runs.  The local entry point is the same file:
#
#     julia --project=. --threads=4 test/runtests.jl
#
# It takes about 22 minutes on eight threads, so the runner is given 90.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: load and ten-step smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Load the package
        run: julia --project=. -e 'using QuaST'
      - name: Check the documentation
        run: julia --project=. scripts/check_docs.jl
      - name: Ten-step production case
        env:
          CASE_OUT: /tmp/quast_smoke
        run: julia --project=. --threads=2 examples/case_realistic_2d.jl smoke

  gates:
    name: full gate suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run the suite
        run: julia --project=. --threads=4 test/runtests.jl
