name: Feature request
description: Propose a change or an addition
title: "[feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The case, benchmark or workflow that is not served today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The change you would like, and the part of the code it touches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they are worse.
    validations:
      required: false
  - type: textarea
    id: check
    attributes:
      label: How it would be checked
      description: The gate, benchmark or measurement that would show the change works.
    validations:
      required: false
